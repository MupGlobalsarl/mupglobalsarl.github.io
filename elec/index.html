<style>
/* Layout : application à une colonne (560px max), en-tête collant ardoise, barre d'onglets fixe en bas, feuille d'édition qui monte du bas */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#E3E9EE; --ink:#15202A; --muted:#566573; --line:#D3DBE2;
  --accent:#A9532A; --accent-ink:#FFFFFF; --accent-soft:#F6E6DC;
  --ok:#2C7A4B; --ok-soft:#E0F0E6; --warn:#A86A10; --warn-soft:#FBEED3; --bad:#B23636; --bad-soft:#F8E1E1;
  --l1:#7A4A2A; --l2:#2B2B2B; --l3:#8A949C; --wn:#2563C9; --wpe:#2E8B3E; --wy:#E3C22F; --wr:#D9701A;
  --head:#1B2833; --head-ink:#EEF2F5; --head-muted:#9FB0BE;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#16202A; --sunk:#1D2935; --ink:#E4EAEF; --muted:#94A3B1; --line:#2B3946;
  --accent:#E08B5C; --accent-ink:#1A0E07; --accent-soft:#3A2418;
  --ok:#5CC287; --ok-soft:#173326; --warn:#E3AE4F; --warn-soft:#3A2C12; --bad:#F07C7C; --bad-soft:#3D1D1D;
  --l1:#C08055; --l2:#C9CED3; --l3:#7D8992; --wn:#6FA2F2; --wpe:#5DBB6A; --wy:#E8CF52; --wr:#F09A4A;
  --head:#0A1016; --head-ink:#E4EAEF; --head-muted:#7F92A3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#16202A; --sunk:#1D2935; --ink:#E4EAEF; --muted:#94A3B1; --line:#2B3946;
  --accent:#E08B5C; --accent-ink:#1A0E07; --accent-soft:#3A2418;
  --ok:#5CC287; --ok-soft:#173326; --warn:#E3AE4F; --warn-soft:#3A2C12; --bad:#F07C7C; --bad-soft:#3D1D1D;
  --l1:#C08055; --l2:#C9CED3; --l3:#7D8992; --wn:#6FA2F2; --wpe:#5DBB6A; --wy:#E8CF52; --wr:#F09A4A;
  --head:#0A1016; --head-ink:#E4EAEF; --head-muted:#7F92A3; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;min-height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink)}
header.top .in{max-width:560px;margin:0 auto;padding-block:10px 12px;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand .eb{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--head-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{margin:0;font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wires{display:flex;gap:3px;margin-top:5px}.wires i{display:block;width:18px;height:3px;border-radius:2px}
.iconbtn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--head-ink);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
main{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:14px}
h2{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:19px;margin:0;text-wrap:balance}
h3{font-size:12px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
button{font:600 14.5px var(--f-body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
a.btnlink{display:inline-flex;align-items:center;justify-content:center;font:600 14.5px var(--f-body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px;text-decoration:none}
a.btnlink.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.btnlink.sm{min-height:36px;padding:6px 11px;font-size:13.5px}
button.sm{min-height:36px;padding:6px 11px;font-size:13.5px}
button:focus-visible,input:focus-visible,select:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.grow>button{flex:1 1 140px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
input,select{font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0;min-height:44px}
input[type=number]{font-family:var(--f-mono);font-size:15px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-display);font-stretch:80%;font-weight:700;font-size:25px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hl .v{color:var(--accent)}
/* Listes */
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-height:56px}
.item .num{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--accent);width:24px}
.item b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .side{display:flex;gap:6px;align-items:center}
.item.cur{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ph{display:inline-block;font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;color:#fff;background:var(--l1)}
.ph.L2{background:var(--l2);color:var(--surface)}.ph.L3{background:var(--l3)}.ph.T{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.alerts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.alerts li{padding:9px 12px;border-radius:9px;font-size:13.5px;border-left:4px solid}
.alerts li.warn{background:var(--warn-soft);border-color:var(--warn)}
.alerts li.bad{background:var(--bad-soft);border-color:var(--bad)}
.alerts li.ok{background:var(--ok-soft);border-color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:26px 12px;border:1px dashed var(--line);border-radius:12px;font-size:14px}
/* Segmenté */
.seg{display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:38px;padding:6px 12px;border:0;background:transparent;color:var(--muted);font-size:13.5px;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* Résultats */
.res{display:grid;gap:8px}
.rc{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface)}
.rc .hd{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.rc .hd b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .hd .num{font-family:var(--f-mono);color:var(--accent);font-weight:600;font-size:13px}
.vals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.vals div{background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
.vals span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.vals strong{display:block;font-family:var(--f-mono);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;margin:0;font-size:14px}
.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.dl .big{font-family:var(--f-display);font-stretch:80%;font-size:24px;color:var(--accent);border-top:2px solid var(--ink);padding-top:6px}
.dl dt.big{font-family:var(--f-body);font-size:15px;color:var(--ink);align-self:end}
.phrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:10px}
.bar{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}.bar>div{height:100%;border-radius:4px}
.phrow .v{font-family:var(--f-mono);font-size:12.5px;text-align:right}
/* Schémas */
.schwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:70vh;-webkit-overflow-scrolling:touch}
.sch{display:block;max-width:none}
.sch text{font-family:var(--f-body);fill:var(--ink);font-size:11px}
.sch .m{fill:var(--muted)}.sch .mono{font-family:var(--f-mono)}
.sch .ln{stroke:var(--ink);stroke-width:1.6;fill:none}
.sch .box{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.zoom{display:flex;gap:6px;align-items:center}
.zoom span{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);min-width:44px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* Devis */
.dv{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dv:last-child{border-bottom:0}
.dv .d{font-size:14px;font-weight:600}
.dv .q{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.dv input{min-height:38px;padding:6px 8px;text-align:right;font-size:14px}
.dv .t{grid-column:2;text-align:right;font-family:var(--f-mono);font-size:13px;font-weight:600}
/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:700;letter-spacing:.02em}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a[aria-current="page"] svg{stroke-width:2.3}
.fab{position:fixed;z-index:24;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));border-radius:16px;min-height:52px;padding:0 18px;box-shadow:0 6px 18px rgba(0,0,0,.22);display:flex;align-items:center;gap:6px}
/* Feuille */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding-top:8px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.shActions{display:flex;gap:8px;flex-wrap:wrap}.shActions .sp{flex:1}
textarea#fb{width:100%;height:200px;font:12px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;max-width:90vw}
.note{font-size:12.5px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
<style>
@media screen{#print{display:none}}
@media print{
  :root:not([data-theme="light"]),:root[data-theme="dark"],:root{--bg:#EEF2F5; --surface:#FFFFFF; --sunk:#E3E9EE; --ink:#15202A; --muted:#566573; --line:#D3DBE2;
  --accent:#A9532A; --accent-ink:#FFFFFF; --accent-soft:#F6E6DC;
  --ok:#2C7A4B; --ok-soft:#E0F0E6; --warn:#A86A10; --warn-soft:#FBEED3; --bad:#B23636; --bad-soft:#F8E1E1;

<body>


<div class="app">
<header class="top gut">
  <div class="in">
    <div class="brand">
      <div class="eb" id="hdEb">MupGlobal SARL · Électricité bâtiment</div>
      <h1 id="hdTitle">MupGlobal Électricité</h1>
      <div class="wires" aria-hidden="true"><i style="background:#9A5E36"></i><i style="background:#555"></i><i style="background:#8A949C"></i><i style="background:#3B7BC8"></i><i style="background:linear-gradient(90deg,#3E8E3E 50%,#E2C33B 50%)"></i></div>
    </div>
    <button class="iconbtn" id="btnReport" type="button" aria-label="Partager le rapport complet" title="Partager le rapport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"/></svg>
    </button>
  </div>
</header>
<main class="gut"><div id="view" class="view"></div></main>
</div>

<button class="fab primary" id="fab" type="button" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fabTxt">Ajouter</span></button>

<nav class="tabs" aria-label="Rubriques"><div class="in" id="tabs"></div></nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet gut" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <div class="in">
    <div class="grab"></div>
    <h2 id="shTitle"></h2>
    <div id="shBody"></div>
    <div class="shActions" id="shActions"></div>
  </div>
</section>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= Données normatives ================= */
const RATINGS=[2,6,10,16,20,25,32,40,50,63,80,100,125,160,200,250];
const SECS=[1.5,2.5,4,6,10,16,25,35,50,70,95,120];
const IZ={B:{2:[17.5,24,32,41,57,76,101,125,151,192,232,269],3:[15.5,21,28,36,50,68,89,110,134,171,207,239]},

/* ================= Utilitaires ================= */
const $=id=>document.getElementById(id);

const duPct=(tri,L,Ib,cos,s)=>(tri?Math.sqrt(3):2)*RHO*L*Ib*cos/s/(tri?400:230)*100;
const ksAuto=n=>n<=1?1:n<=3?0.9:n<=5?0.8:n<=9?0.7:0.6;

/* ================= Calcul ================= */
function compute(){
  const triSupply=S.alim==='tri',alerts=[];
  const cs=S.circuits.map((c,i)=>{const t=TYPES[c.type]||TYPES.autre;const n=Math.max(0,+c.n||0),pu=Math.max(0,+c.pu||0),L=Math.max(0,+c.L||0);const P=n*pu;
    return {i,c,t,n,pu,L,P,Pu:P*t.ku,tri:!!t.tri,gen:!!t.gen}});
  // Répartition des phases : charges générales (éclairage, prises) et appareils spécialisés suivis séparément
  const load={L1:0,L2:0,L3:0},lg={L1:0,L2:0,L3:0},ls={L1:0,L2:0,L3:0};
  const add=(p,x,f)=>{load[p]+=x.Pu*f;(x.gen?lg:ls)[p]+=x.Pu*f};
  cs.forEach(x=>{
    if(x.tri){x.phase='T';['L1','L2','L3'].forEach(p=>add(p,x,1/3))}
    else if(!triSupply){x.phase='L1';add('L1',x,1)}
    else if(x.c.ph&&x.c.ph!=='auto'){x.phase=x.c.ph;add(x.phase,x,1)}
  });
  if(triSupply)cs.filter(x=>!x.tri&&!x.phase).sort((a,b)=>b.Pu-a.Pu).forEach(x=>{const p=['L1','L2','L3'].reduce((a,b)=>load[a]<=load[b]?a:b);x.phase=p;add(p,x,1)});
  // Bilan de puissance de pointe (correctif audit T2) : ks ne s'applique qu'à l'éclairage et aux prises
  const Pinst=cs.reduce((a,x)=>a+x.P,0),Pku=cs.reduce((a,x)=>a+x.Pu,0),Q=cs.reduce((a,x)=>a+x.Pu/x.t.cos,0);
  const cosm=Q>0?Pku/Q:0.9,nGen=cs.filter(x=>x.gen).length,ks=S.ks==='auto'?ksAuto(nGen):+S.ks,res=Math.max(0,+S.res||0)/100;
  const Pgen=cs.filter(x=>x.gen).reduce((a,x)=>a+x.Pu,0),Pspe=Pku-Pgen;
  const Pd=(Pspe+Pgen*ks)*(1+res),Skva=Pd/cosm/1000,PdOld=Pku*ksAuto(cs.length)*(1+res);
  const phD=p=>(ls[p]+lg[p]*ks)*(1+res);
  const Ibf=triSupply?Math.max(phD('L1'),phD('L2'),phD('L3'))/(230*cosm):Pd/(230*cosm);
  // Courants d'emploi et protections des circuits
  cs.forEach(x=>{
    const t=x.t,eff=t.eff||1;
    if(x.tri&&!triSupply)alerts.push(['bad',`Circuit ${x.i+1} « ${x.c.name} » : moteur triphasé sur une alimentation monophasée.`]);
    x.eff=eff;x.Ib=x.tri?x.P/(Math.sqrt(3)*400*t.cos*eff):x.P/(230*t.cos*eff);
    let In=nextRating(x.Ib);
    if(t.fixIn){if(In<=t.fixIn)In=t.fixIn;else alerts.push(['warn',`Circuit ${x.i+1} « ${x.c.name} » : ${fr(x.P)} W dépasse le calibre usuel ${t.fixIn} A, protection portée à ${In} A.`])}
    x.In=In;x.curve=t.motor?'D':'C';x.ncond=x.tri?5:3;
  });
  // Appareil général (correctif audit T1) : jamais plus petit que le plus gros disjoncteur aval
  const maxDown=cs.reduce((a,x)=>Math.max(a,x.In),0),In0=nextRating(Ibf),Inf=Math.max(In0,maxDown?nextRating(maxDown):0);
  if(Inf>In0)alerts.push(['warn',`AGCP porté de ${In0} A à ${Inf} A pour ne pas être plus petit que le plus gros disjoncteur aval (${maxDown} A). Vérifiez l'abonnement correspondant auprès de la SNEL.`]);
  const nf=triSupply?3:2;
  let sf=pickSec(Inf,nf,triSupply?6:10);
  if(sf<0){sf=SECS.length-1;alerts.push(['bad','Arrivée : courant trop élevé pour les sections du programme, étude spécifique nécessaire.'])}
  const Lbr=Math.max(1,+S.lbr||1),duf=s=>(triSupply?1:2)*RHO*Lbr*Ibf*cosm/s/230*100;
  while(duf(SECS[sf])>1&&sf<SECS.length-1)sf++;
  const feed={Ib:Ibf,In:Inf,In0,maxDown,sec:SECS[sf],du:duf(SECS[sf]),iz:izOf(sf,nf)};
  /* Domaine de validité du logiciel : habitation et petit tertiaire (correctif red team) */
  const horsDomaine=[];
  if(Inf>250)horsDomaine.push(`appareil général de ${Inf} A (250 A au plus)`);
  cs.filter(x=>!x.tri&&x.In>63).forEach(x=>horsDomaine.push(`circuit ${x.i+1} protégé en ${x.In} A (63 A au plus en 1P+N)`));
  cs.filter(x=>x.tri&&x.In>125).forEach(x=>horsDomaine.push(`circuit ${x.i+1} protégé en ${x.In} A (125 A au plus)`));
  if(horsDomaine.length)alerts.push(['bad',`Hors du domaine du logiciel (habitation et petit tertiaire) : ${horsDomaine.join(' ; ')}. Faites réaliser cette étude avec un logiciel adapté : la note de calcul ne sera pas imprimée.`]);
  if(!triSupply&&Inf>63)alerts.push(['warn',`AGCP monophasé de ${Inf} A : au-delà de 63 A, un branchement triphasé est en général préférable. Vérifiez auprès de la SNEL.`]);
  // Sections et chutes de tension
  cs.forEach(x=>{
    const t=x.t,nc=x.tri?3:2;
    let si=pickSec(x.In,nc,t.minSec);
    if(si<0){si=SECS.length-1;x.err=true;alerts.push(['bad',`Circuit ${x.i+1} « ${x.c.name} » : courant hors des sections prévues.`])}
    const lim=t.du-feed.du,d=s=>duPct(x.tri,x.L,x.Ib,t.cos,s),si0=si;
    while(d(SECS[si])>lim&&si<SECS.length-1)si++;
    x.upsized=si>si0;x.sec=SECS[si];x.iz=izOf(si,nc);x.du=d(x.sec);x.duTot=x.du+feed.du;x.lim=t.du;
    if(t.motor){x.duStart=duPct(x.tri,x.L,x.Ib*6,0.35,x.sec)+feed.du;
      if(x.duStart>10)alerts.push(['warn',`Circuit ${x.i+1} « ${x.c.name} » : chute de tension au démarrage ${fr(x.duStart,1)} % (plus de 10 %). Prévoyez un démarreur progressif ou une section plus forte.`])}
    x.status=x.duTot>t.du+1e-9||x.err?'bad':(x.n>t.maxPts?'warn':'ok');
    if(x.n>t.maxPts)alerts.push(['warn',`Circuit ${x.i+1} « ${x.c.name} » : ${x.n} points pour ${t.maxPts} maximum. Divisez-le en deux circuits.`]);
    if(x.upsized)alerts.push(['warn',`Circuit ${x.i+1} « ${x.c.name} » : section portée à ${fsec(x.sec)} mm² à cause de la longueur (${fr(x.L)} m).`]);
    if(x.duTot>t.du+1e-9)alerts.push(['bad',`Circuit ${x.i+1} « ${x.c.name} » : chute de tension ${fr(x.duTot,2)} % au-delà de ${t.du} %.`]);
  });
  let imbal=0;
  if(triSupply){const v=[load.L1,load.L2,load.L3],mx=Math.max(...v),mn=Math.min(...v);imbal=mx>0?(mx-mn)/mx*100:0;
    if(imbal>25)alerts.push(['warn',`Déséquilibre entre phases de ${fr(imbal)} %. Changez la phase de certains circuits pour descendre sous 25 %.`])}
  // Différentiels 30 mA (correctif audit T7) : type F pour les appareils à variateur, type A pour cuisson, lave-linge et triphasé
  const dtype=t=>t.typeF?'F':t.typeA?'A':'AC',groups={};
  cs.filter(x=>!x.tri).forEach(x=>{const k=dtype(x.t)+'|'+x.phase;(groups[k]=groups[k]||[]).push(x)});
  const diffs=[];
  Object.keys(groups).sort().forEach(k=>{const [ty,ph]=k.split('|'),arr=groups[k];
    for(let j=0;j<arr.length;j+=8){const g=arr.slice(j,j+8),I=g.reduce((a,x)=>a+x.Ib*x.t.ku,0);
      diffs.push({type:ty,phase:ph,poles:'2P',cal:I>25||g.some(x=>x.c.type==='cuis')?63:40,circ:g})}});
  cs.filter(x=>x.tri).forEach(x=>diffs.push({type:'A',phase:'T',poles:'4P',cal:Math.max(40,nextRating(x.In)),circ:[x]}));
  diffs.forEach((d,j)=>{d.id='ID'+(j+1);d.circ.forEach(x=>x.id=d.id)});
  const modDisj=cs.reduce((a,x)=>a+(x.tri?4:1),0),modDiff=diffs.reduce((a,d)=>a+(d.poles==='4P'?4:2),0),modGen=triSupply?4:2;
  const modTot=modDisj+modDiff+modGen*2,rows=Math.max(1,Math.ceil(modTot*1.2/13));
  if(!cs.length)alerts.push(['warn','Aucun circuit saisi. Ajoutez vos circuits dans l\'onglet Circuits.']);
  if(S.rooms.length){
    const sumR=k=>S.rooms.reduce((a,r)=>a+(+r[k]||0),0),cnt=t=>cs.filter(x=>x.c.type===t).reduce((a,x)=>a+x.n,0);
    const speR=S.rooms.reduce((a,r)=>a+speList(r).length,0),speC=cs.filter(x=>!['ecl','pc','autre'].includes(x.c.type)).length;
    [['points lumineux',sumR('lum'),cnt('ecl')],['prises',sumR('pc'),cnt('pc')],['sorties spécialisées',speR,speC]].forEach(([l,a,b])=>{
      if(a!==b)alerts.push(['warn',`Pièces : ${a} ${l} placés pour ${b} prévus dans les circuits.`])});
  }
  // Réseau de terre
  const T=S.terre,rho=Math.max(0,+T.rho||0),idn=Math.max(0.001,+T.idn||0.5),ul=Math.max(1,+T.ul||50);
  const Rmax=ul/idn,Rvis=Math.min(Rmax,100);
  const Rb=+T.perim>0?2*rho/+T.perim:Infinity,Rp1=+T.lpiq>0?rho/+T.lpiq:Infinity,np=Math.max(0,Math.round(+T.npiq||0));
  const Rp=np>0?Rp1/np*(np>1?1.2:1):Infinity;
  const g=(isFinite(Rb)?1/Rb:0)+(isFinite(Rp)?1/Rp:0),Rt=g>0?1/g:Infinity;
  const pe=feed.sec<=16?feed.sec:(feed.sec<=35?16:feed.sec/2);
  const terre={Rmax,Rvis,Rb,Rp1,Rp,np,Rt,ok:Rt<=Rvis,pe,ct:Math.max(16,pe),lep:Math.min(25,Math.max(6,pe/2)),
    need:isFinite(Rp1)?Math.max(1,Math.ceil(Rp1*1.2/Rvis)):0};
  if(!terre.ok)alerts.push(['bad',`Prise de terre : ${isFinite(Rt)?fr(Rt,1)+' Ω':'non définie'} pour ${fr(Rvis)} Ω maximum. Ajoutez des piquets ou une boucle à fond de fouille.`]);
  return {cs,Pinst,Pku,Pgen,Pspe,Pd,PdOld,ks,nGen,res,cosm,Skva,feed,load,imbal,diffs,mod:{modDisj,modDiff,modGen,modTot,rows},alerts,triSupply,terre,horsDomaine};
}

function buildBom(R){
  const out=[],cab={};
  R.cs.forEach(x=>{const k=x.ncond+'G'+fsec(x.sec);cab[k]=(cab[k]||0)+x.L*1.1});
  Object.keys(cab).sort((a,b)=>a[0]-b[0]||parseFloat(a.slice(2).replace(',','.'))-parseFloat(b.slice(2).replace(',','.'))).forEach(k=>out.push([`Câble ${k} mm²`,Math.ceil(cab[k]/5)*5,'m']));
  const lc=Math.ceil(R.cs.reduce((a,x)=>a+x.L,0)*1.1/5)*5;if(lc)out.push(['Conduit ICTA Ø 20 mm',lc,'m']);
  const f=R.feed;out.push([`Câble U1000 R2V ${R.triSupply?'5G':'3G'}${fsec(f.sec)} mm² (arrivée)`,Math.ceil((+S.lbr||0)*1.1/5)*5,'m']);
  const br={};R.cs.forEach(x=>{const k=`Disjoncteur ${x.tri?'4P':'1P+N'} ${x.In} A courbe ${x.curve}`;br[k]=(br[k]||0)+1});
  Object.keys(br).forEach(k=>out.push([k,br[k],'pce']));
  const dd={};R.diffs.forEach(d=>{const k=`Interrupteur différentiel ${d.poles} ${d.cal} A 30 mA type ${d.type}`;dd[k]=(dd[k]||0)+1});
  Object.keys(dd).forEach(k=>out.push([k,dd[k],'pce']));
  out.push([`AGCP ${R.triSupply?'4P':'2P'} ${f.In} A 500 mA type S`,1,'pce']);
  out.push([`Parafoudre ${R.triSupply?'4P':'2P'} type 2`,1,'pce']);
  out.push([`Coffret ${R.mod.rows} × 13 modules avec peignes`,1,'pce']);
  const pts=t=>R.cs.filter(x=>x.c.type===t).reduce((a,x)=>a+x.n,0);
  if(pts('ecl'))out.push(['Point lumineux (DCL + luminaire LED)',pts('ecl'),'pce']);
  const ni=S.rooms.reduce((a,r)=>a+(+r.int||0),0);if(ni)out.push(['Interrupteur',ni,'pce']);
  if(pts('pc'))out.push(['Prise de courant 2P+T 16 A',pts('pc'),'pce']);
  const spe=R.cs.filter(x=>!['ecl','pc','autre'].includes(x.c.type)).length;if(spe)out.push(['Sortie spécialisée',spe,'pce']);
  const nb=pts('ecl')+pts('pc')+ni;if(nb)out.push(["Boîte d'encastrement",nb,'pce']);
  if(+S.terre.perim>0)out.push(['Câble cuivre nu 25 mm² (boucle à fond de fouille)',Math.ceil(+S.terre.perim*1.1),'m']);
  if(R.terre.np)out.push([`Piquet de terre acier cuivré ${fr(+S.terre.lpiq,1)} m`,R.terre.np,'pce']);
  out.push([`Conducteur de terre vert/jaune ${R.terre.ct} mm²`,10,'m']);
  out.push(['Barrette de coupure et regard de visite',1,'ens.']);
  return out;
}
function defaultPrice(d){
  let m;
  if((m=d.match(/^Câble (\d)G([\d,]+) mm²$/))){const s=parseFloat(m[2].replace(',','.'));return +(0.25+0.12*s*(+m[1])).toFixed(2)}
  if((m=d.match(/U1000 R2V (\d)G([\d,]+)/))){const s=parseFloat(m[2].replace(',','.'));return +(0.6+0.14*s*(+m[1])).toFixed(2)}
  if(d.startsWith('Conduit'))return 0.4;
  if((m=d.match(/^Disjoncteur (1P\+N|4P) (\d+) A/))){const In=+m[2];return m[1]==='4P'?(In<=32?28:45):(In<=32?6:12)}
  if((m=d.match(/^Interrupteur différentiel (2P|4P) (\d+) A .* type (AC|A|F)$/))){let p=m[1]==='4P'?90:(+m[2]>40?45:35);if(m[3]==='A')p+=m[1]==='4P'?30:15;if(m[3]==='F')p+=25;return p}
  if((m=d.match(/^AGCP (2P|4P) (\d+)/)))return m[1]==='4P'?(+m[2]>63?250:120):(+m[2]>63?150:60);
  if(d.startsWith('Parafoudre'))return d.includes('4P')?90:45;
  if((m=d.match(/^Coffret (\d+)/)))return 30*(+m[1]);
  if(d.startsWith('Point lumineux'))return 12;
  if(d==='Interrupteur')return 4;
  if(d.startsWith('Prise de courant'))return 6;
  if(d.startsWith('Sortie spécialisée'))return 10;
  if(d.startsWith('Boîte'))return 0.6;
  if(d.startsWith('Câble cuivre nu'))return 6;
  if(d.startsWith('Piquet'))return 25;
  if(d.startsWith('Conducteur de terre'))return 3.5;
  if(d.startsWith('Barrette'))return 35;
  return 0;
}
const priceOf=d=>PR[d]!=null?PR[d]:defaultPrice(d);
function totals(bom){
  const D=S.devis;let mat=0;bom.forEach(b=>mat+=b[1]*priceOf(b[0]));
  const mo=mat*(+D.mo||0)/100,frs=mat*(+D.fr||0)/100,ht=mat+mo+frs,tva=ht*(+D.tva||0)/100;
  return {mat,mo,frs,ht,tva,ttc:ht+tva};
}

      if(isL)o+=lampSym(xd,cy+2,14);
      else if(type==='pc')o+=`<path d="M${xd-18} ${cy-12}A18 18 0 0 0 ${xd+18} ${cy-12}Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"/>`;
      else o+=`<rect x="${xd-30}" y="${cy-13}" width="60" height="30" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4"/><text x="${xd}" y="${cy+6}" text-anchor="middle" font-size="10" font-weight="700">${esc(short(x.t.label.split(/[ (/]/)[0],10))}</text>`}
    o+=`<text x="${xd}" y="${cy+38}" text-anchor="middle" font-size="10.5">${{ecl:'Point lumineux',pc:'Prise 2P+T',tri:'Moteur'}[type]||'Récepteur'} ${k+1}</text>`;
  });
  if(x.n>m)o+=`<text x="${W-16}" y="${H-12}" text-anchor="end" class="m" font-size="11">… ${x.n} ${isL?'points':'prises'} au total, raccordés de la même manière</text>`;
  const sw=(c,pe)=>`<svg width="26" height="8" viewBox="0 0 26 8">${wire(0,4,26,4,pe?'pe':c)}</svg>`;
  const notes={ecl:'Phase coupée par l\'interrupteur, jamais le neutre. Chaque point reçoit retour, neutre et terre sur un DCL.',
    pc:'Prises en parallèle (repiquage ou boîte de dérivation). Vue de face : phase à droite, neutre à gauche, terre au centre.',
    tri:'Vérifier le sens de rotation à la mise en service. Prévoir un relais thermique réglé au courant nominal.'};
  return {W,H,o,cap:`Circuit ${x.i+1} · ${x.tri?'triphasé':'phase '+x.phase} · ${x.curve}${x.In} sous ${x.id}`,
    leg:(x.tri?`<span>${sw('var(--l1)')}L1 marron</span><span>${sw('var(--l2)')}L2 noir</span><span>${sw('var(--l3)')}L3 gris</span>`:`<span>${sw('var(--l1)')}Phase</span>`)+`<span>${sw('var(--wn)')}Neutre</span><span>${sw('',1)}Terre</span>`+(isL?`<span>${sw('var(--wr)')}Retour lampe</span>`:''),
    note:notes[type]||'Circuit spécialisé : un seul appareil, sans repiquage.'};
}
function drawSchema(){
  const s=schSeg==='unif'?svgUnif():schSeg==='plan'?svgPlan():svgCx(),box=$('schBox');
  if(!s){box.innerHTML=`<div class="empty" style="border:0">${schSeg==='plan'?'Ajoutez des pièces pour générer le schéma de position.':'Ajoutez un circuit pour afficher ce schéma.'}</div>`;$('schLeg').innerHTML='';$('schNote').textContent='';$('schCap').textContent='';$('zv').textContent='';return}
  const z=zoom[schSeg];
  box.innerHTML=`<svg class="sch" width="${Math.round(s.W*z)}" height="${Math.round(s.H*z)}" viewBox="0 0 ${s.W} ${s.H}" role="img" aria-label="${esc(s.cap)}">${s.o}</svg>`;
  box.dataset.w=s.W;$('schLeg').innerHTML=s.leg;$('schNote').textContent=s.note;$('schCap').textContent=s.cap;$('zv').textContent=Math.round(z*100)+' %';

/* ================= Feuille d'édition ================= */
let sheetCtx=null;

function closeSheet(){$('scrim').hidden=true;$('sheet').hidden=true;sheetCtx=null;disarm()}

const ACT_EDIT=(del)=>`${del?'<button type="button" class="danger" data-sh="del">Supprimer</button>':''}<span class="sp"></span><button type="button" data-sh="cancel">Annuler</button><button type="button" class="primary" data-sh="save">Enregistrer</button>`;
function editCircuit(i){
  const isNew=i==null,c=isNew?{name:'',type:'pc',n:6,pu:250,L:20,ph:'auto'}:S.circuits[i];
  const tri=S.alim==='tri';
  openSheet(isNew?'Nouveau circuit':`Circuit ${pad2(i+1)}`,

     ${fld('e_n','Nombre de points',c.n,'number')}${fld('e_pu','Puissance unitaire (W)',c.pu,'number')}
     ${fld('e_L','Longueur (m)',c.L,'number')}
     ${sel('e_ph','Phase',c.ph||'auto',[['auto','Automatique'],['L1','L1'],['L2','L2'],['L3','L3']])}</div>
     <p class="note" id="e_hint" style="margin-top:10px"></p>`,ACT_EDIT(!isNew),{kind:'c',i,focus:isNew});

function editRoom(i){

function saveSheet(){
  const c=sheetCtx;if(!c)return;const num=id=>Math.max(0,parseFloat(String($(id).value).replace(',','.'))||0);
  if(c.kind==='c'){const t=$('e_type').value;
    const o={name:$('e_name').value.trim()||TYPES[t].label,type:t,n:Math.round(num('e_n')),pu:num('e_pu'),L:num('e_L'),ph:$('e_ph').disabled?'auto':$('e_ph').value};
    if(c.i==null)S.circuits.push(o);else S.circuits[c.i]=o;toast(c.i==null?'Circuit ajouté':'Circuit enregistré')}
  else if(c.kind==='r'){const o={name:$('r_name').value.trim()||'Pièce',L:num('r_L'),W:num('r_W'),lum:Math.round(num('r_lum')),int:Math.round(num('r_int')),pc:Math.round(num('r_pc')),spe:$('r_spe').value};
    if(c.i==null)S.rooms.push(o);else S.rooms[c.i]=o;toast(c.i==null?'Pièce ajoutée':'Pièce enregistrée')}
  closeSheet();render();
}
function delSheet(btn){
  const c=sheetCtx;if(!c||c.i==null)return;
  arm(btn,'Confirmer la suppression',()=>{
    if(c.kind==='c')S.circuits.splice(c.i,1);
    else{S.rooms.splice(c.i,1);if(+S.tabRoom>=S.rooms.length)S.tabRoom=Math.max(0,S.rooms.length-1)}
    closeSheet();render();toast('Supprimé')});
}
$('sheet').addEventListener('click',e=>{const b=e.target.closest('[data-sh]');if(!b)return;const a=b.dataset.sh;
  if(a==='save')saveSheet();else if(a==='cancel')closeSheet();else if(a==='del')delSheet(b);else if(a==='copy'){const ta=$('fb');ta.focus();ta.select()}});
$('sheet').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&sheetCtx&&sheetCtx.kind){e.preventDefault();saveSheet()}});

/* ================= Confirmation à deux touches ================= */
let armed=null;
function arm(btn,label,fn){
  if(armed&&armed.btn===btn){const f=armed.fn;disarm();f();return}
  disarm();armed={btn,fn,label:btn.textContent};btn.textContent=label;btn.classList.add('danger');
  armed.t=setTimeout(disarm,3500);
}
function disarm(){if(!armed)return;clearTimeout(armed.t);if(armed.btn.isConnected)armed.btn.textContent=armed.label;armed=null}

/* ================= Copie et rapport ================= */
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function copy(text,msg){
  const fb=()=>openSheet('Copier le texte',`<p class="note" style="margin-bottom:8px">La copie automatique n'est pas disponible ici. Le texte est sélectionné : utilisez « Copier » de votre téléphone.</p><textarea id="fb" readonly>${esc(text)}</textarea>`,
    `<span class="sp"></span><button type="button" data-sh="copy">Tout sélectionner</button><button type="button" class="primary" data-sh="cancel">Fermer</button>`,null);
  try{navigator.clipboard.writeText(text).then(()=>toast(msg),()=>{fb();setTimeout(()=>{const ta=$('fb');ta.focus();ta.select()},60)})}catch(e){fb()}
}
function reportText(){
  R=compute();const f=R.feed,t=R.terre,bom=buildBom(R),T=totals(bom),dv=S.devis.dev,L=[];
  L.push(`${issuerName()||'Entreprise non renseignée'} — Étude électrique bâtiment (logiciel MG Électricité ${APPV}${licensed()?', licence n° '+String(LIC.serial).padStart(4,'0'):', VERSION D\'ESSAI – sans valeur contractuelle'})`);L.push(`Ouvrage : ${S.name}`);L.push(`Lieu : ${S.lieu}`);L.push(`Réalisé par : ${S.auteur}`);L.push(`Date : ${new Date().toLocaleDateString('fr-FR')}`);L.push('');
  L.push('BILAN DE PUISSANCE');L.push(`Installée : ${fr(R.Pinst)} W · Pointe : ${fr(R.Pd)} W (${fr(R.Skva,1)} kVA) · ks ${fr(R.ks,2)} sur éclairage et prises · réserve ${fr(R.res*100)} %`);
  if(R.triSupply)L.push(`Phases : L1 ${fr(R.load.L1)} W · L2 ${fr(R.load.L2)} W · L3 ${fr(R.load.L3)} W · déséquilibre ${fr(R.imbal,1)} %`);
  L.push(`Branchement : ${R.triSupply?'triphasé 400 V':'monophasé 230 V'} · AGCP ${R.triSupply?'4P':'2P'} ${f.In} A 500 mA type S · U1000 R2V ${R.triSupply?'5G':'3G'}${fsec(f.sec)} mm² · ΔU ${fr(f.du,2)} %`);L.push('');
  L.push('CIRCUITS');R.cs.forEach(x=>L.push(`${pad2(x.i+1)}. ${x.c.name} — ${x.phase==='T'?'Tri':x.phase} — ${fr(x.P)} W — ${x.curve}${x.In} — ${x.ncond}G${fsec(x.sec)} — ${fr(x.L)} m — ΔU ${fr(x.duTot,2)} % — ${x.id}`));L.push('');
  L.push('DIFFÉRENTIELS');R.diffs.forEach(d=>L.push(`${d.id} ${d.poles} ${d.cal} A 30 mA type ${d.type} : circuits ${d.circ.map(x=>x.i+1).join(', ')}`));
  L.push(`Coffret : ${R.mod.rows} rangée(s) de 13 modules`);L.push('');
  L.push('RÉSEAU DE TERRE');L.push(`ρ ${fr(+S.terre.rho)} Ω·m · résistance obtenue ${isFinite(t.Rt)?fr(t.Rt,1)+' Ω':'—'} pour ${fr(t.Rvis)} Ω maxi → ${t.ok?'conforme':'insuffisante'}`);
  L.push(`PE ${fsec(t.pe)} mm² · conducteur de terre ${t.ct} mm² · LEP ${t.lep} mm²`);L.push('');
  L.push('DEVIS ESTIMATIF');bom.forEach(b=>L.push(`- ${b[0]} : ${fr(b[1])} ${b[2]} × ${fr(priceOf(b[0]),2)} = ${fr(b[1]*priceOf(b[0]),2)} ${dv}`));
  L.push(`Matériel ${fr(T.mat,2)} · Main-d'œuvre ${fr(T.mo,2)} · Transport ${fr(T.frs,2)} · HT ${fr(T.ht,2)} · TVA ${fr(T.tva,2)}`);L.push(`TOTAL TTC : ${fr(T.ttc,2)} ${dv}`);
  if(R.alerts.length){L.push('');L.push('POINTS DE CONTRÔLE');R.alerts.forEach(a=>L.push('- '+a[1]))}
  L.push('');L.push('Aide au dimensionnement selon la NF C 15-100, à valider par l\'électricien responsable.');
  return L.join('\n');
}
function devisCsv(){
  const bom=buildBom(R),t=totals(bom),D=S.devis,n=v=>v.toFixed(2).replace('.',','),q=v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[[`Devis estimatif — ${S.name}`],[`Lieu : ${S.lieu}`],[`Établi par : ${S.auteur}`],[],['Désignation','Qté','Unité',`PU (${D.dev})`,`Total (${D.dev})`]];
  bom.forEach(b=>{const p=priceOf(b[0]);rows.push([b[0],b[1],b[2],n(p),n(b[1]*p)])});
  rows.push([],['Matériel','','','',n(t.mat)],[`Main-d'œuvre ${D.mo} %`,'','','',n(t.mo)],[`Transport ${D.fr} %`,'','','',n(t.frs)],['Total HT','','','',n(t.ht)],[`TVA ${D.tva} %`,'','','',n(t.tva)],['Total TTC','','','',n(t.ttc)]);
  return rows.map(r=>r.map(q).join(';')).join('\n');
}

/* ================= Version, fichiers, partage ================= */
const APPV='V1.3';
const issuerName=()=>licensed()?LIC.name:DB.issuer.name;
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,40)||'projet';
function download(name,text,type='application/json'){
  try{const b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Fichier enregistré : '+name)}
  catch(e){copy(text,'Contenu copié')}
}
(function(){
  const fi=document.createElement('input');fi.type='file';fi.accept='.json,application/json';fi.id='fileIn';fi.hidden=true;document.body.appendChild(fi);
  fi.addEventListener('change',()=>{
    const f=fi.files&&fi.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{
      try{
        const o=JSON.parse(rd.result);let n=0,last=null;
        const addP=p=>{if(!p||!Array.isArray(p.circuits))return;const id='p'+Date.now().toString(36)+(n++);DB.list[id]=fix(p);last=id};
        const arr=o&&o.type==='sauvegarde'&&o.list&&typeof o.list==='object'?Object.values(o.list):o&&o.project?[o.project]:o&&Array.isArray(o.circuits)?[o]:[];
        if(!arr.length)throw new Error('vide');
        if(!canCreate(arr.length)){fi.value='';return}
        arr.forEach(addP);if(o.type==='sauvegarde'&&o.prices)Object.assign(PR,cleanPR(o.prices));
        if(!last)throw new Error('vide');
        DB.cur=last;S=DB.list[last];render();toast(n>1?`${n} projets importés`:'Projet importé');
      }catch(e){toast('Fichier non reconnu : choisissez un fichier exporté par MupGlobal Électricité')}
      fi.value='';
    };
    rd.readAsText(f);
  });
})();
async function shareReport(){
  const t=reportText();
  if(navigator.share){try{await navigator.share({title:'Étude électrique — '+S.name,text:t});return}catch(e){if(e&&e.name==='AbortError')return}}
  copy(t,'Rapport copié : collez-le dans WhatsApp, un e-mail ou Word');
}

function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

function checkKey(raw){

    const s=String(raw||"").replace(/\s+/g,"").replace(/^MUP-?/i,"");

    const u=b64d(s);
    if(u.length<77)return {ok:false,why:"Clé incomplète : vérifiez que tout le texte a été collé."};
    const pay=u.slice(0,u.length-64),sig=u.slice(u.length-64);
    if(!window.nacl||!nacl.sign.detached.verify(pay,sig,b64d(LIC_PUB)))return {ok:false,why:"Clé non valide : elle n'a pas été émise par MUPGLOBAL SARL ou elle a été modifiée."};
    /* Format 2 : octet « produit » (1 = MUPGLOBAL PV, 2 = MG Électricité, 3 = pack des deux). Les clés du format 1 sont celles de MUPGLOBAL PV. */
    if(pay[0]===1)return {ok:false,why:"Cette clé est une clé MUPGLOBAL PV : elle ne vaut pas pour MG Électricité. Demandez une clé MG Électricité."};
    if(pay[0]!==2)return {ok:false,why:"Version de clé non reconnue : mettez l'application à jour."};
    if(pay[1]!==PRODUCT&&pay[1]!==3)return {ok:false,why:"Cette clé a été émise pour un autre logiciel MUPGLOBAL."};

    for(let i=0;i<5;i++)if(pay[2+i]!==dev[i])return {ok:false,why:`Cette clé a été émise pour un autre appareil. Code de cet appareil pour MG Électricité : ${fmtCode(DEVICE)}.`};

    <div class="row" style="margin:12px 0;padding:10px 12px;background:var(--bg);border-radius:10px"><span class="sub" style="margin:0">Code de cet appareil</span><b style="font-family:var(--f-mono);font-size:18px;letter-spacing:.06em">${fmtCode(DEVICE)}</b><button type="button" class="sm" data-act="copycode">Copier</button></div>
    <label class="f">Clé de licence reçue<textarea id="licKey" rows="3" style="font:13px var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%" placeholder="MUP-…"></textarea></label>
    <div class="btns grow" style="margin-top:10px"><button type="button" class="primary" data-act="activate">Activer la licence</button><a class="btnlink" href="${wa}" target="_blank" rel="noopener">Demander ma clé par WhatsApp</a></div>
    <p class="note" style="margin-top:8px">Une licence par appareil. MUPGLOBAL SARL · ${PHONE}</p></div>`;
}
function openLic(m){if(m)toast(m);if(route!=="accueil")location.hash="#accueil";setTimeout(()=>{const c=$("licCard");if(c)c.scrollIntoView({behavior:"smooth",block:"start"})},120)}
function activate(){
  const raw=($("licKey")||{}).value||"";const r=checkKey(raw);
  if(!r.ok){toast(r.why==="vide"?"Collez d'abord la clé reçue de MUPGLOBAL SARL":r.why);return}
  try{localStorage.setItem(LK.lic,raw.trim())}catch(e){}
  LIC=r;RBLOCK=false;try{localStorage.removeItem(LK.blk)}catch(e){}
  DB.issuer.name=r.name;save();render();toast(`Licence n° ${String(r.serial).padStart(4,"0")} activée : ${r.name}`);setTimeout(rbCheck,500);
}

trialTrack();
go();
</script>

</body>
